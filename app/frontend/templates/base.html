<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="{% block description %}Blur faces, license plates, text, and PII from images, videos, and documents.{% endblock %}"
    />
    <meta property="og:type" content="website" />
    <meta
      property="og:title"
      content="{% block og_title %}Blur Stuff{% endblock %}"
    />
    <meta property="og:description" content="{{ self.description() }}" />
    <title>
      {% block page_title %}{% endblock %} {% if self.page_title() %} - {% endif
      %} Blur Stuff
    </title>
    <link
      rel="stylesheet"
      href="{{ url_for('frontend.static', filename='css/output.css') }}"
    />
    <script
      defer
      src="https://cdn.jsdelivr.net/npm/alpinejs@3.14.9/dist/cdn.min.js"
    ></script>
    {% block head %}{% endblock %}
  </head>
  <body
    class="{% block body_class %}min-h-screen bg-background text-white{% endblock %} antialiased"
  >
    {% include "components/header.html" %}
    <main>{% block content %}{% endblock %}</main>
    {% block footer %} {% include "components/footer.html" %} {% endblock %} {%
    block scripts %}{% endblock %}
    <script src="{{ url_for('frontend.static', filename='js/app.js') }}"></script>
  </body>
</html>
