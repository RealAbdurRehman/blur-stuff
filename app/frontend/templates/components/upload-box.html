<div
  x-data="uploadBox()"
  @mousemove="
    const r = $el.getBoundingClientRect();
    $el.style.setProperty('--x', `${$event.clientX-r.left}px`);
    $el.style.setProperty('--y', `${$event.clientY-r.top}px`);
  "
  @dragover.prevent="isDragging = true"
  @dragleave.prevent="isDragging = false"
  @drop.prevent="handleDrop($event)"
  class="upload-glow relative mt-10 w-full max-w-4xl"
>
  <input
    x-ref="fileInput"
    type="file"
    class="hidden"
    accept="
      .jpg,.jpeg,.png,.webp,.tif,.tiff,.heic,.heif,.gif,
      .mp4,.mov,.avi,.mkv,.webm,
      .pdf,.docx,.pptx,.xlsx
    "
    @change="handleFile"
  />
  <div
    @click="$refs.fileInput.click()"
    class="upload-card group cursor-pointer rounded-3xl border border-indigo-400/20 bg-[#101216] p-2 shadow-[0_0_80px_rgba(99,102,241,0.15)] backdrop-blur-xl"
  >
    <div
      class="relative rounded-2xl border border-dashed border-white/15 py-14 transition group-hover:border-indigo-400/40"
      :class="isDragging ? 'border-indigo-400/60 bg-indigo-500/5' : ''"
    >
      <div
        class="pointer-events-none absolute left-1/2 top-1/2 h-64 w-64 -translate-x-1/2 -translate-y-1/2 rounded-full bg-indigo-500/5 blur-3xl"
      ></div>
      <div
        class="relative mx-auto mb-6 flex h-12 w-12 items-center justify-center rounded-xl border border-white/10 bg-white/5 transition-all duration-300 ease-out group-hover:scale-110"
      >
        <div
          class="transition-transform duration-300 ease-out group-hover:-translate-y-0.5 text-[#AB96F9]"
        >
          {% include "components/icons/arrow.svg" %}
        </div>
      </div>
      <h3 class="relative text-lg font-medium text-white">
        Drag & drop your file here
      </h3>
      <p class="relative mt-2 text-zinc-400">
        or click to
        <span class="text-indigo-400">browse</span>
      </p>
      <p class="relative mt-5 text-sm text-zinc-500">
        Your files are processed securely and never stored.
      </p>
    </div>
  </div>
</div>
