<footer class="mt-25 border-t-2 border-ink bg-paper px-5 pb-8 pt-12 text-ink">
  <div
    class="mx-auto flex max-w-295 flex-col justify-between gap-8 sm:flex-row sm:flex-wrap"
  >
    <div class="footer-brand">
      <a
        href="{{ url_for('frontend.index') }}"
        class="group mb-2.5 flex items-center gap-2.5 font-display text-lg font-extrabold tracking-tight no-underline"
      >
        <span
          class="flex h-8 w-8 -rotate-6 items-center justify-center rounded-lg bg-ink text-paper transition-transform duration-150 group-hover:rotate-0"
        >
          {% include "components/icons/logo.svg" %}
        </span>
        <span>Blur Stuff</span>
      </a>

      <p class="m-0 max-w-65 text-sm leading-relaxed text-ink/65">
        Privacy-first media anonymization for everyone.
      </p>
    </div>
    <div class="flex flex-col items-start gap-4 sm:items-end">
      <nav class="flex flex-wrap gap-x-5.5 gap-y-3 text-sm font-semibold">
        <a
          href="{{ url_for('frontend.about') }}"
          class="text-ink/75 no-underline transition-opacity duration-150 hover:text-ink hover:opacity-100"
        >
          About
        </a>
        <a
          href="{{ url_for('frontend.privacy') }}"
          class="text-ink/75 no-underline transition-opacity duration-150 hover:text-ink hover:opacity-100"
        >
          Privacy Policy
        </a>
        <a
          href="https://github.com/RealAbdurRehman/blur-stuff"
          target="_blank"
          rel="noopener noreferrer"
          class="flex items-center gap-1.5 text-ink/75 no-underline transition-opacity duration-150 hover:text-ink hover:opacity-100"
        >
          {% include "components/icons/github.svg" %} GitHub
        </a>
      </nav>
      <p class="mt-1 font-mono text-[0.7rem] tracking-wide text-ink/50">
        © 2026 Blur Stuff. All rights reserved.
      </p>
    </div>
  </div>
</footer>
