<div
  class="group relative rounded-[10px] border-2 border-ink bg-paper px-5 pb-5 pt-6 shadow-[3px_3px_0_#16171a] transition-all duration-300 ease-out odd:rotate-[-1.2deg] even:rotate-[1.1deg] hover:-translate-y-1 hover:rotate-0 hover:shadow-[4px_4px_0_#16171a]"
>
  <div
    class="absolute -top-3.5 left-4.5 h-8.5 w-5.5 rounded-t-[10px] border-[3px] border-b-0 border-ink bg-background"
  ></div>
  <div
    class="mb-2 font-mono text-[0.68rem] font-bold uppercase tracking-[0.06em] text-hot"
  >
    {{ number }} · {{ category }}
  </div>
  <h3 class="font-display text-[1.05rem] font-bold leading-tight text-ink">
    {{ title }}
  </h3>
  <p class="mt-2 text-[0.88rem] leading-[1.55] text-ink/70">
    {{ description }}
  </p>
</div>
