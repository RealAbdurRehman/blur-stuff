<div
  class="rounded-3xl border border-white/10 bg-white/3 p-7 backdrop-blur-xl transition duration-300 hover:-translate-y-1 hover:bg-white/5"
>
  <div
    class="mb-5 flex h-12 w-12 items-center justify-center rounded-xl border {{ border_class }} {{ bg_class }} shadow-[inset_0_1px_0_rgba(255,255,255,0.04)]"
  >
    <span class="{{ text_class }}"> {% include icon %} </span>
  </div>
  <h3 class="text-lg font-semibold">{{ title }}</h3>
  <p class="mt-3 text-sm leading-6 text-zinc-400">{{ description }}</p>
</div>
