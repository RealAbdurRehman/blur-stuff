<div
  class="mt-10 rounded-xl border-2 border-ink bg-paper p-5 shadow-[4px_4px_0_#16171a] sm:p-6"
>
  <div
    class="mb-5 flex flex-wrap items-end justify-between gap-3 border-b-2 border-ink/15 pb-4"
  >
    <div>
      <h2
        class="mt-1 font-display text-xl font-extrabold tracking-tight text-ink"
      >
        Supported formats
      </h2>
    </div>
  </div>
  <div class="grid gap-4 md:grid-cols-3">
    <div
      class="group relative rounded-lg border-2 border-ink bg-background p-4 pb-6 shadow-[2px_2px_0_#16171a] transition-transform duration-150 hover:-translate-y-0.5"
    >
      <div class="mb-4 flex items-start justify-between">
        <div
          class="flex h-11 w-11 items-center justify-center rounded-md border-2 border-ink bg-paper-2"
        >
          <span class="text-ink [&>svg]:h-6 [&>svg]:w-6">
            {% include "components/icons/image.svg" %}
          </span>
        </div>
      </div>
      <h3 class="font-display text-base font-extrabold text-ink">Images</h3>
      <p class="mt-2 text-xs leading-6 text-ink/60">
        PNG, JPG, JPEG, WEBP, HEIC, TIFF, BMP, GIF
      </p>
    </div>
    <div
      class="group relative rounded-lg border-2 border-ink bg-background p-4 pb-6 shadow-[2px_2px_0_#16171a] transition-transform duration-150 hover:-translate-y-0.5"
    >
      <div class="mb-4 flex items-start justify-between">
        <div
          class="flex h-11 w-11 items-center justify-center rounded-md border-2 border-ink bg-paper-2"
        >
          <span class="text-ink [&>svg]:h-6 [&>svg]:w-6">
            {% include "components/icons/video.svg" %}
          </span>
        </div>
      </div>
      <h3 class="font-display text-base font-extrabold text-ink">Videos</h3>
      <p class="mt-2 text-xs leading-6 text-ink/60">
        MP4, MOV, AVI, MKV, WEBM, M4V, 3GP
      </p>
    </div>
    <div
      class="group relative rounded-lg border-2 border-ink bg-background p-4 pb-6 shadow-[2px_2px_0_#16171a] transition-transform duration-150 hover:-translate-y-0.5"
    >
      <div class="mb-4 flex items-start justify-between">
        <div
          class="flex h-11 w-11 items-center justify-center rounded-md border-2 border-ink bg-paper-2"
        >
          <span class="text-ink [&>svg]:h-6 [&>svg]:w-6">
            {% include "components/icons/file.svg" %}
          </span>
        </div>
      </div>
      <h3 class="font-display text-base font-extrabold text-ink">Documents</h3>
      <p class="mt-2 text-xs leading-6 text-ink/60">
        PDF, DOCX, PPTX, TXT, XLSX
      </p>
    </div>
  </div>
</div>
