<header class="fixed inset-x-0 top-0 z-50 text-ink">
  <nav
    class="relative flex h-18 w-full items-center border-b-2 border-ink bg-paper px-5 shadow-[0_4px_0_#16171a] md:px-8"
  >
    <a
      href="{{ url_for('frontend.index') }}"
      class="group flex shrink-0 items-center gap-2 font-display text-lg font-extrabold tracking-tight"
    >
      <span
        class="flex h-8 w-8 -rotate-6 items-center justify-center rounded-lg bg-ink text-paper transition-transform duration-150 group-hover:rotate-0"
      >
        {% include "components/icons/logo.svg" %}
      </span>
      <span>Blur Stuff</span>
    </a>
    <ul
      class="absolute left-1/2 hidden -translate-x-1/2 items-center gap-7 text-sm font-semibold md:flex"
    >
      <li>
        <a
          href="{{ url_for('frontend.api') }}"
          class="opacity-60 transition-opacity duration-150 hover:opacity-100"
        >
          API
        </a>
      </li>
      <li>
        <a
          href="{{ url_for('frontend.docs') }}"
          class="opacity-60 transition-opacity duration-150 hover:opacity-100"
        >
          Docs
        </a>
      </li>
      <li>
        <a
          href="{{ url_for('frontend.about') }}"
          class="opacity-60 transition-opacity duration-150 hover:opacity-100"
        >
          About
        </a>
      </li>
    </ul>
    <a
      href="{{ url_for('frontend.detect') }}"
      class="stamp-button ml-auto inline-flex items-center gap-2 rounded-full border-2 border-ink bg-ink px-4 py-2.5 font-mono text-xs font-bold uppercase tracking-wide text-paper shadow-[3px_3px_0_rgba(0,0,0,0.35)] sm:px-5"
    >
      <span>{{ upload_button_text }}</span>
      {% include "components/icons/upload.svg" %}
    </a>
  </nav>
</header>
