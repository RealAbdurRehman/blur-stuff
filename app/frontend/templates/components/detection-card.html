<button
  type="button"
  class="group relative w-full cursor-pointer rounded-lg border-2 border-ink p-3 text-left transition-all duration-150"
  :class="
    isDetectionSelected(detection)
      ? 'bg-paper shadow-[2px_2px_0_#16171a]'
      : 'bg-paper-2 hover:-translate-y-0.5 hover:shadow-[2px_2px_0_#16171a]'
  "
  @click="toggleDetection(detection)"
>
  <div class="flex items-center gap-3">
    <div
      class="flex h-5 w-5 shrink-0 items-center justify-center rounded-md border-2 border-ink transition-all duration-150"
      :class="
        isDetectionSelected(detection)
          ? 'bg-hot text-white'
          : 'bg-transparent text-transparent group-hover:bg-paper-2'
      "
    >
      <svg
        x-show="isDetectionSelected(detection)"
        x-cloak
        viewBox="0 0 20 20"
        fill="none"
        class="h-3 w-3"
      >
        <path
          d="M4 10.5L8 14L16 6"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
          stroke-linejoin="round"
        />
      </svg>
    </div>
    <template x-if="isCropDetection(detection)">
      <div
        class="relative h-14 w-14 shrink-0 overflow-hidden rounded-lg border-2 border-ink bg-paper-2"
      >
        <template x-if="!cropUrls[detection.uniqueId || detection.id]">
          <div class="absolute inset-0 flex items-center justify-center">
            <div
              class="h-5 w-5 animate-spin rounded-full border-2 border-ink/20 border-t-hot"
            ></div>
          </div>
        </template>
        <template x-if="cropUrls[detection.uniqueId || detection.id]">
          <img
            :src="cropUrls[detection.uniqueId || detection.id]"
            alt=""
            class="h-full w-full object-cover"
            draggable="false"
          />
        </template>
      </div>
    </template>
    <div class="min-w-0 flex-1">
      <div class="flex min-w-0 items-center gap-2">
        <template x-if="detection.text">
          <p
            class="min-w-0 truncate font-display text-sm font-bold text-ink"
            x-text="detection.text"
          ></p>
        </template>
        <template x-if="!detection.text">
          <p
            class="min-w-0 truncate font-display text-sm font-bold text-ink"
            x-text="detectionName(detection)"
          ></p>
        </template>
        <template x-if="fileType === 'document' && detection.page != null">
          <span
            class="shrink-0 rounded-full border border-ink/30 bg-paper-2 px-1.5 py-0.5 font-mono text-[9px] font-bold text-ink/60"
            x-text="`Page ${detection.page}`"
          ></span>
        </template>
      </div>
      <template x-if="fileType === 'video' && detection.timestamp != null">
        <p
          class="mt-1 font-mono text-[10px] text-ink/40"
          x-text="`First seen at ${formatDuration(detection.timestamp)}`"
        ></p>
      </template>
      <template x-if="detection.type">
        <span
          class="mt-1 inline-flex w-fit rounded-full border border-ink/20 bg-paper-2 px-1.5 py-0.5 font-mono text-[9px] font-bold uppercase tracking-wide text-ink/60"
          x-text="detection.type"
        ></span>
      </template>
      <template x-if="detection.confidence != null">
        <p
          class="mt-1 font-mono text-[10px]"
          :class="confidenceClass(detection.confidence)"
          x-text="confidenceLabel(detection.confidence)"
        ></p>
      </template>
    </div>
  </div>
</button>
