<button
  type="button"
  class="group relative w-full rounded-xl border p-3 text-left transition"
  :class="
    isDetectionSelected(detection)
      ? 'border-indigo-500/70 bg-indigo-500/8 shadow-[0_0_0_1px_rgba(99,102,241,0.15)]'
      : 'border-white/5 bg-white/2 hover:border-white/10 hover:bg-white/4'
  "
  @click="toggleDetection(detection)"
>
  <div class="flex items-center gap-3">
    <div
      class="flex h-5 w-5 shrink-0 items-center justify-center rounded-md border transition"
      :class="
        isDetectionSelected(detection)
          ? 'border-indigo-400 bg-indigo-500'
          : 'border-white/15 bg-black/20 group-hover:border-white/30'
      "
    >
      <svg
        x-show="isDetectionSelected(detection)"
        viewBox="0 0 20 20"
        fill="none"
        class="h-3 w-3 text-white"
      >
        <path
          d="M4 10.5L8 14L16 6"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
          stroke-linejoin="round"
        />
      </svg>
    </div>
    <template x-if="isCropDetection(detection)">
      <div
        class="relative h-14 w-14 shrink-0 overflow-hidden rounded-lg border border-white/10 bg-black/30"
      >
        <template x-if="!cropUrls[detection.uniqueId || detection.id]">
          <div class="absolute inset-0 flex items-center justify-center">
            <div
              class="h-5 w-5 animate-spin rounded-full border-2 border-white/10 border-t-indigo-400"
            ></div>
          </div>
        </template>
        <template x-if="cropUrls[detection.uniqueId || detection.id]">
          <img
            :src="cropUrls[detection.uniqueId || detection.id]"
            alt=""
            class="h-full w-full object-cover"
            draggable="false"
          />
        </template>
        <div
          class="pointer-events-none absolute inset-0 rounded-lg ring-1 ring-indigo-400/60"
        ></div>
      </div>
    </template>
    <div class="min-w-0 flex-1">
      <template x-if="detection.text">
        <p
          class="truncate text-sm font-medium text-white"
          x-text="detection.text"
        ></p>
      </template>
      <template x-if="!detection.text">
        <p
          class="truncate text-sm font-semibold text-white"
          x-text="detectionName(detection)"
        ></p>
      </template>
      <template x-if="fileType === 'video' && detection.start_time != null">
        <p
          class="mt-1 text-[10px] text-zinc-500"
          x-text="formatDetectionTimeRange(detection)"
        ></p>
      </template>
      <template x-if="detection.confidence != null">
        <p
          class="mt-1 text-[10px]"
          :class="confidenceClass(detection.confidence)"
          x-text="confidenceLabel(detection.confidence)"
        ></p>
      </template>
    </div>
  </div>
</button>
