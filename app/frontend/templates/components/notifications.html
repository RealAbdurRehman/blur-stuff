<div
  x-data
  class="pointer-events-none fixed inset-x-4 bottom-4 z-100 sm:left-auto sm:w-105"
>
  <div class="relative flex flex-col items-end gap-3">
    <template
      x-for="notification in $store.notifications.items"
      :key="notification.id"
    >
      <div
        x-show="notification.visible"
        x-transition:enter="transition ease-out duration-200"
        x-transition:enter-start="translate-y-3 opacity-0 scale-[0.97]"
        x-transition:enter-end="translate-y-0 opacity-100 scale-100"
        x-transition:leave="transition ease-in duration-150"
        x-transition:leave-start="translate-y-0 opacity-100 scale-100"
        x-transition:leave-end="translate-y-2 opacity-0 scale-[0.97]"
        x-collapse.duration.200ms
        class="pointer-events-auto w-full overflow-hidden rounded-xl border-2 border-ink bg-paper text-ink shadow-[4px_4px_0_#16171a]"
      >
        <div class="flex items-start gap-3 p-4">
          <div
            class="flex h-9 w-9 shrink-0 items-center justify-center rounded-md border-2 border-ink bg-paper-2"
            :class="{
              'text-hot': notification.type === 'error',
              'text-green-600': notification.type === 'success',
              'text-yellow-500': notification.type === 'warning',
              'text-blue-500': notification.type === 'info'
            }"
          >
            <template x-if="notification.type === 'error'">
              <span>{% include "components/icons/alert.svg" %}</span>
            </template>
            <template x-if="notification.type === 'success'">
              <span>{% include "components/icons/success.svg" %}</span>
            </template>
            <template x-if="notification.type === 'warning'">
              <span>{% include "components/icons/close.svg" %}</span>
            </template>
            <template x-if="notification.type === 'info'">
              <span>{% include "components/icons/info.svg" %}</span>
            </template>
          </div>
          <div class="min-w-0 flex-1 pt-0.5">
            <p
              class="font-display text-sm font-extrabold"
              :class="{
                'text-hot': notification.type === 'error',
                'text-green-600': notification.type === 'success',
                'text-yellow-500': notification.type === 'warning',
                'text-blue-500': notification.type === 'info'
              }"
              x-text="
                notification.type === 'error'
                  ? 'Something went wrong'
                  : notification.type === 'success'
                    ? 'Success'
                    : notification.type === 'warning'
                      ? 'Warning'
                      : 'Information'
              "
            ></p>
            <p
              class="mt-1 text-sm leading-5 text-ink/65"
              x-text="notification.message"
            ></p>
          </div>
          <button
            type="button"
            @click="$store.notifications.remove(notification.id)"
            class="flex h-7 w-7 shrink-0 cursor-pointer items-center justify-center rounded-md border-2 border-transparent text-ink/40 transition-all duration-150 hover:border-ink/15 hover:bg-paper-2 hover:text-ink"
            aria-label="Dismiss notification"
          >
            {% include "components/icons/close.svg" %}
          </button>
        </div>
        <div
          class="h-1.5 w-full bg-ink/10"
          :class="{
            'bg-hot': notification.type === 'error',
            'bg-green-600': notification.type === 'success',
            'bg-yellow-500': notification.type === 'warning',
            'bg-blue-500': notification.type === 'info'
          }"
        ></div>
      </div>
    </template>
  </div>
</div>
