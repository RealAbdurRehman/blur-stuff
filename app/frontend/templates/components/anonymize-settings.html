<div
  class="overflow-hidden rounded-3xl border border-white/10 bg-[#0d1014] p-6 shadow-[0_0_40px_rgba(0,0,0,0.15)] lg:p-6"
>
  <div>
    <div class="flex items-start gap-4">
      <div
        class="flex h-9 w-9 shrink-0 items-center justify-center rounded-xl border border-white/10 bg-white/3 text-zinc-300"
      >
        {% include "components/icons/target.svg" %}
      </div>
      <div>
        <h2 class="text-base font-semibold text-white">Detection Targets</h2>
        <p class="mt-1 text-sm text-zinc-500">
          Choose what to detect and anonymize.
        </p>
      </div>
    </div>
    <div class="mt-5 space-y-2">
      <button
        type="button"
        @click="targets.faces = !targets.faces"
        class="group flex w-full cursor-pointer items-center gap-4 rounded-xl border border-white/10 bg-white/3 px-4 py-3 text-left transition-all duration-200 hover:border-white/15 hover:bg-white/5"
        :class="targets.faces
          ? 'border-white/10 bg-white/[0.035]'
          : 'opacity-60'"
      >
        <div
          class="flex h-6 w-6 shrink-0 items-center justify-center rounded-md border transition-all duration-200"
          :class="targets.faces
            ? 'border-indigo-400 bg-indigo-500 text-white'
            : 'border-white/20 bg-transparent'"
        >
          <svg
            x-show="targets.faces"
            x-cloak
            xmlns="http://www.w3.org/2000/svg"
            viewBox="0 0 20 20"
            fill="none"
            class="h-4 w-4"
          >
            <path
              d="M4 10.5 8 14l8-8"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
            />
          </svg>
        </div>
        <div
          class="flex h-7 w-7 shrink-0 items-center justify-center text-zinc-300"
        >
          {% include "components/icons/scan.svg" %}
        </div>
        <div class="min-w-0 flex-1">
          <p class="text-sm font-medium text-white">Faces</p>
          <p class="mt-0.5 text-xs text-zinc-500">
            Detect and blur human faces.
          </p>
        </div>
      </button>
      <button
        type="button"
        @click="targets.plates = !targets.plates"
        class="group flex w-full cursor-pointer items-center gap-4 rounded-xl border border-white/10 bg-white/3 px-4 py-3 text-left transition-all duration-200 hover:border-white/15 hover:bg-white/5"
        :class="targets.plates
          ? 'border-white/10 bg-white/[0.035]'
          : 'opacity-60'"
      >
        <div
          class="flex h-6 w-6 shrink-0 items-center justify-center rounded-md border transition-all duration-200"
          :class="targets.plates
            ? 'border-indigo-400 bg-indigo-500 text-white'
            : 'border-white/20 bg-transparent'"
        >
          <svg
            x-show="targets.plates"
            x-cloak
            xmlns="http://www.w3.org/2000/svg"
            viewBox="0 0 20 20"
            fill="none"
            class="h-4 w-4"
          >
            <path
              d="M4 10.5 8 14l8-8"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
            />
          </svg>
        </div>
        <div
          class="flex h-7 w-7 shrink-0 items-center justify-center text-zinc-300"
        >
          {% include "components/icons/car.svg" %}
        </div>
        <div class="min-w-0 flex-1">
          <p class="text-sm font-medium text-white">License Plates</p>
          <p class="mt-0.5 text-xs text-zinc-500">
            Detect vehicle license plates.
          </p>
        </div>
      </button>
      <button
        type="button"
        @click="targets.text = !targets.text"
        class="group flex w-full cursor-pointer items-center gap-4 rounded-xl border border-white/10 bg-white/3 px-4 py-3 text-left transition-all duration-200 hover:border-white/15 hover:bg-white/5"
        :class="targets.text
          ? 'border-white/10 bg-white/[0.035]'
          : 'opacity-60'"
      >
        <div
          class="flex h-6 w-6 shrink-0 items-center justify-center rounded-md border transition-all duration-200"
          :class="targets.text
            ? 'border-indigo-400 bg-indigo-500 text-white'
            : 'border-white/20 bg-transparent'"
        >
          <svg
            x-show="targets.text"
            x-cloak
            xmlns="http://www.w3.org/2000/svg"
            viewBox="0 0 20 20"
            fill="none"
            class="h-4 w-4"
          >
            <path
              d="M4 10.5 8 14l8-8"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
            />
          </svg>
        </div>
        <div
          class="flex h-7 w-7 shrink-0 items-center justify-center text-zinc-300"
        >
          {% include "components/icons/text.svg" %}
        </div>
        <div class="min-w-0 flex-1">
          <p class="text-sm font-medium text-white">Text</p>
          <p class="mt-0.5 text-xs text-zinc-500">
            Detect all visible text (OCR).
          </p>
        </div>
      </button>
      <button
        type="button"
        @click="targets.pii = !targets.pii"
        class="group flex w-full cursor-pointer items-center gap-4 rounded-xl border border-white/10 bg-white/3 px-4 py-3 text-left transition-all duration-200 hover:border-white/15 hover:bg-white/5"
        :class="targets.pii
          ? 'border-white/10 bg-white/[0.035]'
          : 'opacity-60'"
      >
        <div
          class="flex h-6 w-6 shrink-0 items-center justify-center rounded-md border transition-all duration-200"
          :class="targets.pii
            ? 'border-indigo-400 bg-indigo-500 text-white'
            : 'border-white/20 bg-transparent'"
        >
          <svg
            x-show="targets.pii"
            x-cloak
            xmlns="http://www.w3.org/2000/svg"
            viewBox="0 0 20 20"
            fill="none"
            class="h-4 w-4"
          >
            <path
              d="M4 10.5 8 14l8-8"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
            />
          </svg>
        </div>
        <div
          class="flex h-7 w-7 shrink-0 items-center justify-center text-zinc-300"
        >
          {% include "components/icons/pii.svg" %}
        </div>
        <div class="min-w-0 flex-1">
          <p class="text-sm font-medium text-white">
            Personal Information (PII)
          </p>
          <p class="mt-0.5 text-xs text-zinc-500">
            Detect emails, phones, IDs and more.
          </p>
        </div>
      </button>
    </div>
  </div>
  <div class="my-5 h-px bg-white/10"></div>
  <div>
    <div class="flex items-start gap-4">
      <div
        class="flex h-9 w-9 shrink-0 items-center justify-center rounded-xl border border-white/10 bg-white/3 text-zinc-300"
      >
        {% include "components/icons/wand.svg" %}
      </div>
      <div>
        <h2 class="text-base font-semibold text-white">Anonymization Mode</h2>
        <p class="mt-1 text-sm text-zinc-500">
          Choose how the detected content should be obscured.
        </p>
      </div>
    </div>
    <div class="mt-5 grid grid-cols-3 gap-2.5">
      <button
        type="button"
        @click="mode = 'blur'"
        class="cursor-pointer rounded-xl border p-3 text-left transition-all duration-200"
        :class="mode === 'blur'
          ? 'border-indigo-400/70 bg-indigo-500/5'
          : 'border-white/10 bg-white/3 hover:border-white/15 hover:bg-white/5'"
      >
        <div class="flex items-center gap-2">
          <span
            class="flex h-4 w-4 items-center justify-center rounded-full border"
            :class="mode === 'blur'
              ? 'border-indigo-400'
              : 'border-white/20'"
          >
            <span
              x-show="mode === 'blur'"
              class="h-2 w-2 rounded-full bg-indigo-400"
            ></span>
          </span>
          <span class="text-sm font-medium text-white">Blur</span>
        </div>
        <p class="mt-2 text-xs leading-relaxed text-zinc-500">Smooth blur</p>
      </button>
      <button
        type="button"
        @click="mode = 'pixelate'"
        class="cursor-pointer rounded-xl border p-3 text-left transition-all duration-200"
        :class="mode === 'pixelate'
          ? 'border-indigo-400/70 bg-indigo-500/5'
          : 'border-white/10 bg-white/3 hover:border-white/15 hover:bg-white/5'"
      >
        <div class="flex items-center gap-2">
          <span
            class="flex h-4 w-4 items-center justify-center rounded-full border"
            :class="mode === 'pixelate'
              ? 'border-indigo-400'
              : 'border-white/20'"
          >
            <span
              x-show="mode === 'pixelate'"
              class="h-2 w-2 rounded-full bg-indigo-400"
            ></span>
          </span>
          <span class="text-sm font-medium text-white">Pixelate</span>
        </div>
        <p class="mt-2 text-xs leading-relaxed text-zinc-500">Mosaic effect</p>
      </button>
      <button
        type="button"
        @click="mode = 'solid'"
        class="cursor-pointer rounded-xl border p-3 text-left transition-all duration-200"
        :class="mode === 'solid'
          ? 'border-indigo-400/70 bg-indigo-500/5'
          : 'border-white/10 bg-white/3 hover:border-white/15 hover:bg-white/5'"
      >
        <div class="flex items-center gap-2">
          <span
            class="flex h-4 w-4 items-center justify-center rounded-full border"
            :class="mode === 'solid'
              ? 'border-indigo-400'
              : 'border-white/20'"
          >
            <span
              x-show="mode === 'solid'"
              class="h-2 w-2 rounded-full bg-indigo-400"
            ></span>
          </span>
          <span class="text-sm font-medium text-white">Solid</span>
        </div>
        <p class="mt-2 text-xs leading-relaxed text-zinc-500">
          Solid color block
        </p>
      </button>
      <button
        type="button"
        @click="mode = 'noise'"
        class="cursor-pointer rounded-xl border p-3 text-left transition-all duration-200"
        :class="mode === 'noise'
          ? 'border-indigo-400/70 bg-indigo-500/5'
          : 'border-white/10 bg-white/3 hover:border-white/15 hover:bg-white/5'"
      >
        <div class="flex items-center gap-2">
          <span
            class="flex h-4 w-4 items-center justify-center rounded-full border"
            :class="mode === 'noise'
              ? 'border-indigo-400'
              : 'border-white/20'"
          >
            <span
              x-show="mode === 'noise'"
              class="h-2 w-2 rounded-full bg-indigo-400"
            ></span>
          </span>
          <span class="text-sm font-medium text-white">Noise</span>
        </div>
        <p class="mt-2 text-xs leading-relaxed text-zinc-500">
          Add noise effect
        </p>
      </button>
      <button
        type="button"
        @click="mode = 'emoji'"
        class="cursor-pointer rounded-xl border p-3 text-left transition-all duration-200"
        :class="mode === 'emoji'
          ? 'border-indigo-400/70 bg-indigo-500/5'
          : 'border-white/10 bg-white/3 hover:border-white/15 hover:bg-white/5'"
      >
        <div class="flex items-center gap-2">
          <span
            class="flex h-4 w-4 items-center justify-center rounded-full border"
            :class="mode === 'emoji'
              ? 'border-indigo-400'
              : 'border-white/20'"
          >
            <span
              x-show="mode === 'emoji'"
              class="h-2 w-2 rounded-full bg-indigo-400"
            ></span>
          </span>

          <span class="text-sm font-medium text-white">Emoji</span>
        </div>
        <p class="mt-2 text-xs leading-relaxed text-zinc-500">
          Replace with emoji
        </p>
      </button>
      <button
        type="button"
        @click="mode = 'inpaint'"
        class="cursor-pointer rounded-xl border p-3 text-left transition-all duration-200"
        :class="mode === 'inpaint'
          ? 'border-indigo-400/70 bg-indigo-500/5'
          : 'border-white/10 bg-white/3 hover:border-white/15 hover:bg-white/5'"
      >
        <div class="flex items-center gap-2">
          <span
            class="flex h-4 w-4 items-center justify-center rounded-full border"
            :class="mode === 'inpaint'
              ? 'border-indigo-400'
              : 'border-white/20'"
          >
            <span
              x-show="mode === 'inpaint'"
              class="h-2 w-2 rounded-full bg-indigo-400"
            ></span>
          </span>
          <span class="text-sm font-medium text-white">Inpaint</span>
        </div>
        <p class="mt-2 text-xs leading-relaxed text-zinc-500">
          Smart inpainting
        </p>
      </button>
    </div>
  </div>
  <button
    type="button"
    :disabled="!canProcess()"
    :class="!canProcess()
    ? 'cursor-not-allowed bg-white/10 text-zinc-600 shadow-none'
    : 'cursor-pointer bg-white text-zinc-900 shadow-[0_0_25px_rgba(255,255,255,0.08)] hover:bg-zinc-100 hover:shadow-[0_0_35px_rgba(255,255,255,0.12)] active:scale-[0.99]'"
    class="group mt-6 flex w-full items-center justify-center gap-1 rounded-xl px-5 py-4 text-base font-semibold transition-all duration-200"
  >
    <span>Detect Sensitive Content</span>
    <span
      class="transition-transform duration-200 ease-out group-hover:translate-x-1"
    >
      {% include "components/icons/arrow-right.svg" %}
    </span>
  </button>
</div>
