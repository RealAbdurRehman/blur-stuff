<div
  class="overflow-hidden rounded-xl border-2 border-ink bg-paper p-5 shadow-[4px_4px_0_#16171a] lg:p-6"
>
  <div class="border-b-2 border-ink/15 pb-5">
    <div class="flex items-center gap-3">
      <div
        class="flex h-10 w-10 shrink-0 items-center justify-center rounded-md border-2 border-ink bg-paper-2 text-ink"
      >
        {% include "components/icons/target.svg" %}
      </div>
      <div>
        <h2
          class="mt-1 font-display text-xl font-extrabold tracking-tight text-ink"
        >
          What should we find?
        </h2>
        <p class="mt-1 text-sm leading-relaxed text-ink/60">
          Select the sensitive content you want to detect.
        </p>
      </div>
    </div>
  </div>
  <div class="mt-5 space-y-3">
    <button
      type="button"
      @click="targets.faces = !targets.faces"
      class="group flex w-full cursor-pointer items-center gap-3 rounded-lg border-2 border-ink bg-background p-3 text-left shadow-[2px_2px_0_#16171a] transition-all duration-150 hover:-translate-y-0.5"
      :class="targets.faces
        ? 'bg-paper-2'
        : 'opacity-55 shadow-none'"
    >
      <div
        class="flex h-6 w-6 shrink-0 items-center justify-center rounded-md border-2 border-ink transition-all duration-150"
        :class="targets.faces
          ? 'bg-hot text-white'
          : 'bg-transparent text-transparent'"
      >
        <svg
          x-show="targets.faces"
          x-cloak
          xmlns="http://www.w3.org/2000/svg"
          viewBox="0 0 20 20"
          fill="none"
          class="h-4 w-4"
        >
          <path
            d="M4 10.5 8 14l8-8"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
          />
        </svg>
      </div>
      <div
        class="flex h-9 w-9 shrink-0 items-center justify-center rounded-md border border-ink/15 bg-paper text-ink transition-transform duration-150 group-hover:-rotate-3"
      >
        {% include "components/icons/scan.svg" %}
      </div>
      <div class="min-w-0 flex-1">
        <div class="flex items-center justify-between gap-2">
          <p class="font-display text-sm font-bold text-ink">Faces</p>
        </div>
        <p class="mt-0.5 text-xs leading-relaxed text-ink/55">
          Detect human faces.
        </p>
      </div>
    </button>
    <button
      type="button"
      @click="targets.plates = !targets.plates"
      class="group flex w-full cursor-pointer items-center gap-3 rounded-lg border-2 border-ink bg-background p-3 text-left shadow-[2px_2px_0_#16171a] transition-all duration-150 hover:-translate-y-0.5"
      :class="targets.plates
        ? 'bg-paper-2'
        : 'opacity-55 shadow-none'"
    >
      <div
        class="flex h-6 w-6 shrink-0 items-center justify-center rounded-md border-2 border-ink transition-all duration-150"
        :class="targets.plates
          ? 'bg-hot text-white'
          : 'bg-transparent text-transparent'"
      >
        <svg
          x-show="targets.plates"
          x-cloak
          xmlns="http://www.w3.org/2000/svg"
          viewBox="0 0 20 20"
          fill="none"
          class="h-4 w-4"
        >
          <path
            d="M4 10.5 8 14l8-8"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
          />
        </svg>
      </div>
      <div
        class="flex h-9 w-9 shrink-0 items-center justify-center rounded-md border border-ink/15 bg-paper text-ink transition-transform duration-150 group-hover:-rotate-3"
      >
        {% include "components/icons/car.svg" %}
      </div>
      <div class="min-w-0 flex-1">
        <div class="flex items-center justify-between gap-2">
          <p class="font-display text-sm font-bold text-ink">License Plates</p>
        </div>
        <p class="mt-0.5 text-xs leading-relaxed text-ink/55">
          Detect vehicle license plates.
        </p>
      </div>
    </button>
    <button
      type="button"
      @click="targets.text = !targets.text"
      class="group flex w-full cursor-pointer items-center gap-3 rounded-lg border-2 border-ink bg-background p-3 text-left shadow-[2px_2px_0_#16171a] transition-all duration-150 hover:-translate-y-0.5"
      :class="targets.text
        ? 'bg-paper-2'
        : 'opacity-55 shadow-none'"
    >
      <div
        class="flex h-6 w-6 shrink-0 items-center justify-center rounded-md border-2 border-ink transition-all duration-150"
        :class="targets.text
          ? 'bg-hot text-white'
          : 'bg-transparent text-transparent'"
      >
        <svg
          x-show="targets.text"
          x-cloak
          xmlns="http://www.w3.org/2000/svg"
          viewBox="0 0 20 20"
          fill="none"
          class="h-4 w-4"
        >
          <path
            d="M4 10.5 8 14l8-8"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
          />
        </svg>
      </div>
      <div
        class="flex h-9 w-9 shrink-0 items-center justify-center rounded-md border border-ink/15 bg-paper text-ink transition-transform duration-150 group-hover:-rotate-3"
      >
        {% include "components/icons/text.svg" %}
      </div>
      <div class="min-w-0 flex-1">
        <div class="flex items-center justify-between gap-2">
          <p class="font-display text-sm font-bold text-ink">Text</p>
        </div>
        <p class="mt-0.5 text-xs leading-relaxed text-ink/55">
          Detect visible text.
        </p>
      </div>
    </button>
    <button
      type="button"
      @click="targets.pii = !targets.pii"
      class="group flex w-full cursor-pointer items-center gap-3 rounded-lg border-2 border-ink bg-background p-3 text-left shadow-[2px_2px_0_#16171a] transition-all duration-150 hover:-translate-y-0.5"
      :class="targets.pii
        ? 'bg-paper-2'
        : 'opacity-55 shadow-none'"
    >
      <div
        class="flex h-6 w-6 shrink-0 items-center justify-center rounded-md border-2 border-ink transition-all duration-150"
        :class="targets.pii
          ? 'bg-hot text-white'
          : 'bg-transparent text-transparent'"
      >
        <svg
          x-show="targets.pii"
          x-cloak
          xmlns="http://www.w3.org/2000/svg"
          viewBox="0 0 20 20"
          fill="none"
          class="h-4 w-4"
        >
          <path
            d="M4 10.5 8 14l8-8"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
          />
        </svg>
      </div>
      <div
        class="flex h-9 w-9 shrink-0 items-center justify-center rounded-md border border-ink/15 bg-paper text-ink transition-transform duration-150 group-hover:-rotate-3"
      >
        {% include "components/icons/pii.svg" %}
      </div>
      <div class="min-w-0 flex-1">
        <div class="flex items-center justify-between gap-2">
          <p class="font-display text-sm font-bold text-ink">
            Personal Information
          </p>
        </div>
        <p class="mt-0.5 text-xs leading-relaxed text-ink/55">
          Detect emails, phones, names and more.
        </p>
      </div>
    </button>
  </div>
  <div class="mt-5 border-t-2 border-ink/15 pt-5">
    <button
      type="button"
      @click="detect()"
      :disabled="!canDetect() || isDetecting"
      :class="!canDetect() || isDetecting
    ? 'cursor-not-allowed border-ink/20 bg-ink/5 text-ink/30 shadow-none'
    : 'cursor-pointer border-ink bg-hot text-white shadow-[3px_3px_0_#16171a] hover:-translate-y-0.5 hover:translate-x-0.5 hover:shadow-[2px_2px_0_#16171a] active:translate-x-1 active:translate-y-1 active:shadow-none'"
      class="group flex w-full items-center justify-center gap-2 rounded-lg border-2 px-5 py-3.5 font-mono text-xs font-bold uppercase tracking-wide transition-all duration-150"
    >
      <template x-if="isDetecting">
        <span class="flex items-center gap-2">
          <svg class="h-4 w-4 animate-spin" viewBox="0 0 24 24" fill="none">
            <circle
              class="opacity-25"
              cx="12"
              cy="12"
              r="9"
              stroke="currentColor"
              stroke-width="3"
            />
            <path
              class="opacity-90"
              d="M21 12a9 9 0 0 1-9 9"
              stroke="currentColor"
              stroke-width="3"
              stroke-linecap="round"
            />
          </svg>
          <span>Detecting...</span>
        </span>
      </template>
      <template x-if="!isDetecting">
        <span class="flex items-center gap-2">
          <span>Detect Sensitive Content</span>
          <span
            class="transition-transform duration-150 group-hover:translate-x-1"
          >
            {% include "components/icons/arrow-right.svg" %}
          </span>
        </span>
      </template>
    </button>
  </div>
</div>
