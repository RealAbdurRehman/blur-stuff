<div
  class="overflow-hidden rounded-xl border-2 border-ink bg-paper shadow-[4px_4px_0_#16171a]"
>
  <div class="border-b-2 border-ink/15 px-5 py-4">
    <div class="flex items-center justify-between gap-4">
      <div>
        <div class="flex items-center gap-2">
          <h2
            class="font-display text-xl font-extrabold tracking-tight text-ink"
          >
            Detections
          </h2>
          <span
            class="rounded-full border-2 border-ink bg-hot px-2 py-0.5 font-mono text-[10px] font-bold text-white"
            x-text="totalDetectionCount()"
          ></span>
        </div>
        <p class="mt-1 text-xs text-ink/50">
          Review what was detected in your file.
        </p>
      </div>
      <button
        type="button"
        @click="toggleSelectAll()"
        x-text="allDetectionsSelected() ? 'Clear all' : 'Select all'"
        class="shrink-0 cursor-pointer whitespace-nowrap rounded-full border-2 border-ink bg-paper-2 px-3 py-1.5 font-mono text-[10px] font-bold uppercase tracking-wide text-ink shadow-[1px_1px_0_#16171a] transition-all duration-150 hover:translate-x-0.5 hover:translate-y-0.5 hover:shadow-none"
      ></button>
    </div>
  </div>
  <div class="border-b-2 border-ink/15 bg-background px-5 py-3">
    <p
      class="font-mono text-[10px] font-bold uppercase tracking-wide text-ink/45"
    >
      <span x-text="totalDetectionCount()"></span>
      <span
        x-text="totalDetectionCount() === 1 ? 'detection found' : 'detections found'"
      ></span>
    </p>
  </div>
  <div class="max-h-[calc(100vh-13rem)] overflow-y-auto p-4">
    <template x-if="detectionsFor('faces').length">
      <div class="mb-4">
        <div class="mb-2 flex items-center justify-between">
          <div class="flex items-center gap-2.5">
            <div
              class="flex h-8 w-8 items-center justify-center rounded-lg border-2 border-ink bg-paper-2 text-ink"
            >
              <span class="[&>svg]:h-4 [&>svg]:w-4">
                {% include "components/icons/scan.svg" %}
              </span>
            </div>
            <div>
              <p
                class="font-display text-xs font-bold uppercase tracking-wide text-ink"
              >
                Faces
              </p>
            </div>
          </div>
          <span
            class="rounded-full border-2 border-ink bg-paper-2 px-2 py-0.5 font-mono text-[10px] font-bold text-ink"
            x-text="detectionsFor('faces').length"
          ></span>
        </div>
        <div class="space-y-2">
          <template
            x-for="detection in detectionsFor('faces')"
            :key="detection.uniqueId || detection.id"
          >
            {% include "components/detection-card.html" %}
          </template>
        </div>
      </div>
    </template>
    <template x-if="detectionsFor('plates').length">
      <div class="mb-4 border-t-2 border-ink/10 pt-4">
        <div class="mb-2 flex items-center justify-between">
          <div class="flex items-center gap-2.5">
            <div
              class="flex h-8 w-8 items-center justify-center rounded-lg border-2 border-ink bg-paper-2 text-ink"
            >
              <span class="[&>svg]:h-4 [&>svg]:w-4">
                {% include "components/icons/car.svg" %}
              </span>
            </div>
            <div>
              <p
                class="font-display text-xs font-bold uppercase tracking-wide text-ink"
              >
                License Plates
              </p>
            </div>
          </div>
          <span
            class="rounded-full border-2 border-ink bg-paper-2 px-2 py-0.5 font-mono text-[10px] font-bold text-ink"
            x-text="detectionsFor('plates').length"
          ></span>
        </div>
        <div class="space-y-2">
          <template
            x-for="detection in detectionsFor('plates')"
            :key="detection.uniqueId || detection.id"
          >
            {% include "components/detection-card.html" %}
          </template>
        </div>
      </div>
    </template>
    <template x-if="detectionsFor('text').length">
      <div class="mb-4 border-t-2 border-ink/10 pt-4">
        <div class="mb-2 flex items-center justify-between">
          <div class="flex items-center gap-2.5">
            <div
              class="flex h-8 w-8 items-center justify-center rounded-lg border-2 border-ink bg-paper-2 text-ink"
            >
              <span class="[&>svg]:h-4 [&>svg]:w-4">
                {% include "components/icons/text.svg" %}
              </span>
            </div>
            <div>
              <p
                class="font-display text-xs font-bold uppercase tracking-wide text-ink"
              >
                Text
              </p>
            </div>
          </div>
          <span
            class="rounded-full border-2 border-ink bg-paper-2 px-2 py-0.5 font-mono text-[10px] font-bold text-ink"
            x-text="detectionsFor('text').length"
          ></span>
        </div>
        <div class="space-y-2">
          <template
            x-for="detection in detectionsFor('text')"
            :key="detection.uniqueId || detection.id"
          >
            {% include "components/detection-card.html" %}
          </template>
        </div>
      </div>
    </template>
    <template x-if="detectionsFor('pii').length">
      <div class="border-t-2 border-ink/10 pt-4">
        <div class="mb-2 flex items-center justify-between">
          <div class="flex items-center gap-2.5">
            <div
              class="flex h-8 w-8 items-center justify-center rounded-lg border-2 border-ink bg-paper-2 text-ink"
            >
              <span class="[&>svg]:h-4 [&>svg]:w-4">
                {% include "components/icons/pii.svg" %}
              </span>
            </div>
            <div>
              <p
                class="font-display text-xs font-bold uppercase tracking-wide text-ink"
              >
                Personal Information
              </p>
            </div>
          </div>
          <span
            class="rounded-full border-2 border-ink bg-paper-2 px-2 py-0.5 font-mono text-[10px] font-bold text-ink"
            x-text="detectionsFor('pii').length"
          ></span>
        </div>
        <div class="space-y-2">
          <template
            x-for="detection in detectionsFor('pii')"
            :key="detection.uniqueId || detection.id"
          >
            {% include "components/detection-card.html" %}
          </template>
        </div>
      </div>
    </template>
    <template x-if="totalDetectionCount() === 0">
      <div
        class="flex flex-col items-center justify-center px-6 py-12 text-center"
      >
        <div
          class="flex h-12 w-12 items-center justify-center rounded-xl border-2 border-ink bg-paper-2"
        >
          <span class="[&>svg]:h-6 [&>svg]:w-6 text-ink/50">
            {% include "components/icons/scan.svg" %}
          </span>
        </div>
        <p class="mt-4 font-display text-sm font-bold text-ink">
          Nothing detected
        </p>
        <p class="mt-1 max-w-xs text-xs leading-relaxed text-ink/45">
          We couldn't find any content that needs anonymization.
        </p>
      </div>
    </template>
  </div>
</div>
