<div
  class="overflow-hidden rounded-xl border-2 border-ink bg-paper shadow-[4px_4px_0_#16171a]"
>
  <div
    class="flex items-center justify-between border-b-2 border-ink/15 px-5 py-4"
  >
    <div class="flex min-w-0 items-center gap-3">
      <div
        class="flex h-10 w-10 shrink-0 items-center justify-center rounded-md border-2 border-ink bg-paper-2 text-ink"
      >
        <template x-if="fileType === 'image'">
          {% include "components/icons/image.svg" %}
        </template>

        <template x-if="fileType === 'video'">
          {% include "components/icons/video.svg" %}
        </template>

        <template x-if="isDocument()">
          {% include "components/icons/file.svg" %}
        </template>
      </div>
      <div class="min-w-0">
        <p
          class="truncate font-display text-sm font-bold text-ink"
          x-text="file?.name || 'No file selected'"
        ></p>
        <p x-show="file" class="mt-1 text-xs text-ink/50">
          <span x-text="fileTypeLabel()"></span>
          <span class="mx-1">•</span>
          <span x-text="formatSize(file?.size)"></span>
          <template x-if="fileType === 'image' && imageDimensions">
            <span>
              <span class="mx-1">•</span>
              <span x-text="imageDimensions"></span>
            </span>
          </template>
          <template x-if="fileType === 'video' && videoDuration">
            <span>
              <span class="mx-1">•</span>
              <span x-text="formatDuration(videoDuration)"></span>
            </span>
          </template>
        </p>
      </div>
    </div>
  </div>
  <div class="relative bg-paper-2">
    <template x-if="isLoading">
      <div class="flex aspect-video items-center justify-center">
        <div class="text-center">
          <div
            class="mx-auto h-8 w-8 animate-spin rounded-full border-2 border-white/20 border-t-hot"
          ></div>
          <p
            class="mt-3 font-mono text-xs font-bold uppercase tracking-wide text-white/60"
          >
            Loading preview...
          </p>
        </div>
      </div>
    </template>
    <template x-if="!isLoading && fileType === 'image'">
      <div class="relative aspect-video bg-paper-2">
        <div class="relative h-full w-full">
          <img
            :src="previewUrl"
            :alt="file?.name"
            class="h-full w-full object-contain"
            @load="handleImageLoad($event)"
          />
          <div
            x-show="showDetections"
            class="pointer-events-none absolute inset-0"
          >
            <template
              x-for="detection in visibleDetections()"
              :key="detection.id"
            >
              <div
                class="absolute border-2 border-hot"
                :style="boxStyle(detection)"
              >
                <span
                  class="absolute -top-6 left-0 rounded-sm border-2 border-ink bg-hot px-1.5 py-0.5 font-mono text-[10px] font-bold uppercase tracking-wide text-white"
                  x-text="detection.label"
                ></span>
              </div>
            </template>
          </div>
        </div>
      </div>
    </template>
    <template x-if="!isLoading && fileType === 'video'">
      <div class="aspect-video bg-paper-2">
        <video
          x-ref="video"
          :src="previewUrl"
          controls
          playsinline
          class="h-full w-full object-contain"
          @loadedmetadata="handleVideoMetadata($event)"
        ></video>
      </div>
    </template>
    <template x-if="!isLoading && fileType === 'document'">
      <div class="aspect-video bg-paper-2">
        <iframe
          :src="previewUrl"
          class="h-full w-full"
          title="Document preview"
        ></iframe>
      </div>
    </template>
    <template x-if="!isLoading && !file">
      <div class="flex aspect-video flex-col items-center justify-center">
        <div
          class="flex h-12 w-12 items-center justify-center rounded-md border-2 border-white/15 bg-white/5 text-white/50"
        >
          {% include "components/icons/file.svg" %}
        </div>
        <p
          class="mt-3 font-mono text-xs font-bold uppercase tracking-wide text-white/50"
        >
          No file available
        </p>
      </div>
    </template>
  </div>
</div>
