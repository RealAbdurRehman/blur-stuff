<div
  class="rounded-2xl border border-white/10 bg-white/2 p-5 shadow-[0_20px_60px_rgba(0,0,0,0.18)]"
>
  <div class="mb-5">
    <h2 class="text-sm font-semibold text-white">Anonymization Mode</h2>

    <p class="mt-1 text-xs leading-relaxed text-zinc-500">
      Choose how the selected content should be obscured.
    </p>
  </div>
  <div class="grid grid-cols-2 gap-2">
    <button
      type="button"
      @click="mode = 'blur'"
      class="group relative rounded-xl border p-3 text-left transition cursor-pointer"
      :class="
        mode === 'blur'
          ? 'border-indigo-500/70 bg-indigo-500/5'
          : 'border-white/5 bg-white/2 hover:border-white/10 hover:bg-white/4'
      "
    >
      <div class="flex items-start gap-2.5">
        <div
          class="mt-0.5 flex h-4 w-4 shrink-0 items-center justify-center rounded-full border transition"
          :class="
            mode === 'blur'
              ? 'border-indigo-400 bg-indigo-500'
              : 'border-white/20 bg-black/20 group-hover:border-white/30'
          "
        >
          <div
            x-show="mode === 'blur'"
            class="h-1.5 w-1.5 rounded-full bg-white"
          ></div>
        </div>
        <div class="min-w-0">
          <p class="text-xs font-semibold text-white">Blur</p>
          <p class="mt-1 text-[10px] text-zinc-500">Smooth blur</p>
        </div>
      </div>
    </button>
    <button
      type="button"
      @click="mode = 'pixelate'"
      class="group relative rounded-xl border p-3 text-left transition cursor-pointer"
      :class="
        mode === 'pixelate'
          ? 'border-indigo-500/70 bg-indigo-500/5'
          : 'border-white/5 bg-white/2 hover:border-white/10 hover:bg-white/4'
      "
    >
      <div class="flex items-start gap-2.5">
        <div
          class="mt-0.5 flex h-4 w-4 shrink-0 items-center justify-center rounded-full border transition"
          :class="
            mode === 'pixelate'
              ? 'border-indigo-400 bg-indigo-500'
              : 'border-white/20 bg-black/20 group-hover:border-white/30'
          "
        >
          <div
            x-show="mode === 'pixelate'"
            class="h-1.5 w-1.5 rounded-full bg-white"
          ></div>
        </div>
        <div class="min-w-0">
          <p class="text-xs font-semibold text-white">Pixelate</p>
          <p class="mt-1 text-[10px] text-zinc-500">Mosaic effect</p>
        </div>
      </div>
    </button>
    <button
      type="button"
      @click="mode = 'solid'"
      class="group relative rounded-xl border p-3 text-left transition cursor-pointer"
      :class="
        mode === 'solid'
          ? 'border-indigo-500/70 bg-indigo-500/5'
          : 'border-white/5 bg-white/2 hover:border-white/10 hover:bg-white/4'
      "
    >
      <div class="flex items-start gap-2.5">
        <div
          class="mt-0.5 flex h-4 w-4 shrink-0 items-center justify-center rounded-full border transition"
          :class="
            mode === 'solid'
              ? 'border-indigo-400 bg-indigo-500'
              : 'border-white/20 bg-black/20 group-hover:border-white/30'
          "
        >
          <div
            x-show="mode === 'solid'"
            class="h-1.5 w-1.5 rounded-full bg-white"
          ></div>
        </div>
        <div class="min-w-0">
          <p class="text-xs font-semibold text-white">Solid</p>
          <p class="mt-1 text-[10px] text-zinc-500">Solid color block</p>
        </div>
      </div>
    </button>
    <button
      type="button"
      @click="mode = 'noise'"
      class="group relative rounded-xl border p-3 text-left transition cursor-pointer"
      :class="
        mode === 'noise'
          ? 'border-indigo-500/70 bg-indigo-500/5'
          : 'border-white/5 bg-white/2 hover:border-white/10 hover:bg-white/4'
      "
    >
      <div class="flex items-start gap-2.5">
        <div
          class="mt-0.5 flex h-4 w-4 shrink-0 items-center justify-center rounded-full border transition"
          :class="
            mode === 'noise'
              ? 'border-indigo-400 bg-indigo-500'
              : 'border-white/20 bg-black/20 group-hover:border-white/30'
          "
        >
          <div
            x-show="mode === 'noise'"
            class="h-1.5 w-1.5 rounded-full bg-white"
          ></div>
        </div>
        <div class="min-w-0">
          <p class="text-xs font-semibold text-white">Noise</p>
          <p class="mt-1 text-[10px] text-zinc-500">Add noise</p>
        </div>
      </div>
    </button>
    <button
      type="button"
      @click="mode = 'emoji'"
      class="group relative rounded-xl border p-3 text-left transition cursor-pointer"
      :class="
        mode === 'emoji'
          ? 'border-indigo-500/70 bg-indigo-500/5'
          : 'border-white/5 bg-white/2 hover:border-white/10 hover:bg-white/4'
      "
    >
      <div class="flex items-start gap-2.5">
        <div
          class="mt-0.5 flex h-4 w-4 shrink-0 items-center justify-center rounded-full border transition"
          :class="
            mode === 'emoji'
              ? 'border-indigo-400 bg-indigo-500'
              : 'border-white/20 bg-black/20 group-hover:border-white/30'
          "
        >
          <div
            x-show="mode === 'emoji'"
            class="h-1.5 w-1.5 rounded-full bg-white"
          ></div>
        </div>
        <div class="min-w-0">
          <p class="text-xs font-semibold text-white">Emoji</p>
          <p class="mt-1 text-[10px] text-zinc-500">Replace with emoji</p>
        </div>
      </div>
    </button>
    <button
      type="button"
      @click="mode = 'inpaint'"
      class="group relative rounded-xl border p-3 text-left transition cursor-pointer"
      :class="
        mode === 'inpaint'
          ? 'border-indigo-500/70 bg-indigo-500/5'
          : 'border-white/5 bg-white/2 hover:border-white/10 hover:bg-white/4'
      "
    >
      <div class="flex items-start gap-2.5">
        <div
          class="mt-0.5 flex h-4 w-4 shrink-0 items-center justify-center rounded-full border transition"
          :class="
            mode === 'inpaint'
              ? 'border-indigo-400 bg-indigo-500'
              : 'border-white/20 bg-black/20 group-hover:border-white/30'
          "
        >
          <div
            x-show="mode === 'inpaint'"
            class="h-1.5 w-1.5 rounded-full bg-white"
          ></div>
        </div>
        <div class="min-w-0">
          <p class="text-xs font-semibold text-white">Inpaint</p>
          <p class="mt-1 text-[10px] text-zinc-500">Smart inpainting</p>
        </div>
      </div>
    </button>
  </div>
  <div class="my-5 h-px bg-white/5"></div>
  <div>
    <div class="flex items-center justify-between">
      <div>
        <h3 class="text-xs font-semibold text-white">Padding</h3>
        <p class="mt-1 text-[10px] text-zinc-500">
          Add extra area around detections.
        </p>
      </div>
      <span
        class="text-xs font-medium text-zinc-400"
        x-text="`${padding}%`"
      ></span>
    </div>
    <div class="mt-4">
      <input
        type="range"
        min="0"
        max="100"
        x-model.number="padding"
        class="h-1.5 w-full cursor-pointer appearance-none rounded-full bg-white/10 accent-indigo-500"
      />
    </div>
  </div>
  <div class="mt-6 rounded-xl border border-white/5 bg-black/10 p-3.5">
    <div class="flex items-center justify-between">
      <div>
        <p class="text-xs font-semibold text-white">
          Selected for Anonymization
        </p>
        <p
          class="mt-1 text-[10px] text-zinc-500"
          x-text="`${selectedDetections.length} ${
            selectedDetections.length === 1 ? 'item' : 'items'
          } selected`"
        ></p>
      </div>
      <button
        type="button"
        @click="selectedDetections = []"
        :disabled="selectedDetections.length === 0"
        class="rounded-lg border border-white/10 px-2.5 py-1.5 text-[10px] font-medium text-zinc-400 transition hover:border-white/15 hover:bg-white/5 hover:text-white disabled:cursor-not-allowed disabled:opacity-40 cursor-pointer"
      >
        Clear all
      </button>
    </div>
    <div class="mt-3 flex flex-wrap gap-1.5">
      <template
        x-for="detection in selectedDetections"
        :key="detection.uniqueId || detection.id"
      >
        <span
          class="inline-flex items-center gap-1 rounded-md border border-indigo-500/20 bg-indigo-500/10 px-2 py-1 text-[12px] font-medium text-indigo-300"
        >
          <span x-text="detectionName(detection)"></span>
          <button
            type="button"
            class="text-indigo-400 transition hover:text-white cursor-pointer"
            :aria-label="`Remove ${detectionName(detection)}`"
            @click.stop="toggleDetection(detection)"
          >
            <span class="[&>svg]:h-3.5 [&>svg]:w-3.5">
              {% include "components/icons/close.svg" %}
            </span>
          </button>
        </span>
      </template>
      <template x-if="selectedDetections.length === 0">
        <span class="text-[10px] text-zinc-600"> No detections selected. </span>
      </template>
    </div>
  </div>
  <button
    type="button"
    @click="anonymizeSelected()"
    :disabled="isProcessing || selectedDetections.length === 0"
    class="mt-4 flex w-full items-center justify-center gap-2 rounded-xl bg-white px-4 py-3 text-sm font-semibold text-black transition hover:bg-zinc-200 disabled:cursor-not-allowed disabled:opacity-50 cursor-pointer"
  >
    <template x-if="!isProcessing">
      <span class="flex items-center gap-2">
        Process File
        <svg viewBox="0 0 20 20" fill="none" class="h-4 w-4">
          <path
            d="M4 10H16M11 5L16 10L11 15"
            stroke="currentColor"
            stroke-width="1.7"
            stroke-linecap="round"
            stroke-linejoin="round"
          />
        </svg>
      </span>
    </template>
    <template x-if="isProcessing">
      <span class="flex items-center gap-2">
        <span
          class="h-4 w-4 animate-spin rounded-full border-2 border-black/20 border-t-black"
        ></span>
        Processing...
      </span>
    </template>
  </button>
</div>
