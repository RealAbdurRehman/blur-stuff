<div
  class="overflow-hidden rounded-xl border-2 border-ink bg-paper p-5 shadow-[4px_4px_0_#16171a] lg:p-6"
>
  <div class="border-b-2 border-ink/15 pb-5">
    <div>
      <h2 class="font-display text-xl font-extrabold tracking-tight text-ink">
        Anonymize
      </h2>
      <p class="mt-1 text-sm leading-relaxed text-ink/60">
        Choose how the selected content should be hidden.
      </p>
    </div>
  </div>
  <div class="mt-5">
    <div class="mb-3 flex items-end justify-between">
      <div>
        <h3
          class="font-display text-sm font-bold uppercase tracking-wide text-ink"
        >
          Method
        </h3>
        <p class="mt-1 text-xs text-ink/50">Select an anonymization style.</p>
      </div>
    </div>
    <div class="grid grid-cols-2 gap-2.5">
      <button
        type="button"
        @click="mode = 'blur'"
        class="group relative cursor-pointer rounded-lg border-2 border-ink bg-background p-3 text-left shadow-[2px_2px_0_#16171a] transition-all duration-150 hover:-translate-y-0.5"
        :class="
          mode === 'blur'
            ? 'bg-paper-2'
            : 'opacity-60 shadow-none'
        "
      >
        <div class="flex items-start gap-2.5">
          <div
            class="mt-0.5 flex h-5 w-5 shrink-0 items-center justify-center rounded-md border-2 border-ink transition-all duration-150"
            :class="
              mode === 'blur'
                ? 'bg-hot text-white'
                : 'bg-transparent text-transparent'
            "
          >
            <svg
              x-show="mode === 'blur'"
              x-cloak
              viewBox="0 0 20 20"
              fill="none"
              class="h-3.5 w-3.5"
            >
              <path
                d="M4 10.5 8 14l8-8"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
              />
            </svg>
          </div>
          <div>
            <p class="font-display text-xs font-bold text-ink">Blur</p>
            <p class="mt-1 text-[10px] leading-relaxed text-ink/50">
              Smooth blur
            </p>
          </div>
        </div>
      </button>
      <button
        type="button"
        @click="mode = 'pixelate'"
        class="group relative cursor-pointer rounded-lg border-2 border-ink bg-background p-3 text-left shadow-[2px_2px_0_#16171a] transition-all duration-150 hover:-translate-y-0.5"
        :class="
          mode === 'pixelate'
            ? 'bg-paper-2'
            : 'opacity-60 shadow-none'
        "
      >
        <div class="flex items-start gap-2.5">
          <div
            class="mt-0.5 flex h-5 w-5 shrink-0 items-center justify-center rounded-md border-2 border-ink transition-all duration-150"
            :class="
              mode === 'pixelate'
                ? 'bg-hot text-white'
                : 'bg-transparent text-transparent'
            "
          >
            <svg
              x-show="mode === 'pixelate'"
              x-cloak
              viewBox="0 0 20 20"
              fill="none"
              class="h-3.5 w-3.5"
            >
              <path
                d="M4 10.5 8 14l8-8"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
              />
            </svg>
          </div>
          <div>
            <p class="font-display text-xs font-bold text-ink">Pixelate</p>
            <p class="mt-1 text-[10px] leading-relaxed text-ink/50">
              Mosaic effect
            </p>
          </div>
        </div>
      </button>
      <button
        type="button"
        @click="mode = 'solid'"
        class="group relative cursor-pointer rounded-lg border-2 border-ink bg-background p-3 text-left shadow-[2px_2px_0_#16171a] transition-all duration-150 hover:-translate-y-0.5"
        :class="
          mode === 'solid'
            ? 'bg-paper-2'
            : 'opacity-60 shadow-none'
        "
      >
        <div class="flex items-start gap-2.5">
          <div
            class="mt-0.5 flex h-5 w-5 shrink-0 items-center justify-center rounded-md border-2 border-ink transition-all duration-150"
            :class="
              mode === 'solid'
                ? 'bg-hot text-white'
                : 'bg-transparent text-transparent'
            "
          >
            <svg
              x-show="mode === 'solid'"
              x-cloak
              viewBox="0 0 20 20"
              fill="none"
              class="h-3.5 w-3.5"
            >
              <path
                d="M4 10.5 8 14l8-8"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
              />
            </svg>
          </div>
          <div>
            <p class="font-display text-xs font-bold text-ink">Solid</p>
            <p class="mt-1 text-[10px] leading-relaxed text-ink/50">
              Solid color block
            </p>
          </div>
        </div>
      </button>
      <button
        type="button"
        @click="mode = 'noise'"
        class="group relative cursor-pointer rounded-lg border-2 border-ink bg-background p-3 text-left shadow-[2px_2px_0_#16171a] transition-all duration-150 hover:-translate-y-0.5"
        :class="
          mode === 'noise'
            ? 'bg-paper-2'
            : 'opacity-60 shadow-none'
        "
      >
        <div class="flex items-start gap-2.5">
          <div
            class="mt-0.5 flex h-5 w-5 shrink-0 items-center justify-center rounded-md border-2 border-ink transition-all duration-150"
            :class="
              mode === 'noise'
                ? 'bg-hot text-white'
                : 'bg-transparent text-transparent'
            "
          >
            <svg
              x-show="mode === 'noise'"
              x-cloak
              viewBox="0 0 20 20"
              fill="none"
              class="h-3.5 w-3.5"
            >
              <path
                d="M4 10.5 8 14l8-8"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
              />
            </svg>
          </div>
          <div>
            <p class="font-display text-xs font-bold text-ink">Noise</p>
            <p class="mt-1 text-[10px] leading-relaxed text-ink/50">
              Add noise
            </p>
          </div>
        </div>
      </button>
      <button
        type="button"
        @click="mode = 'emoji'"
        class="group relative cursor-pointer rounded-lg border-2 border-ink bg-background p-3 text-left shadow-[2px_2px_0_#16171a] transition-all duration-150 hover:-translate-y-0.5"
        :class="
          mode === 'emoji'
            ? 'bg-paper-2'
            : 'opacity-60 shadow-none'
        "
      >
        <div class="flex items-start gap-2.5">
          <div
            class="mt-0.5 flex h-5 w-5 shrink-0 items-center justify-center rounded-md border-2 border-ink transition-all duration-150"
            :class="
              mode === 'emoji'
                ? 'bg-hot text-white'
                : 'bg-transparent text-transparent'
            "
          >
            <svg
              x-show="mode === 'emoji'"
              x-cloak
              viewBox="0 0 20 20"
              fill="none"
              class="h-3.5 w-3.5"
            >
              <path
                d="M4 10.5 8 14l8-8"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
              />
            </svg>
          </div>
          <div>
            <p class="font-display text-xs font-bold text-ink">Emoji</p>
            <p class="mt-1 text-[10px] leading-relaxed text-ink/50">
              Replace with emoji
            </p>
          </div>
        </div>
      </button>
      <button
        type="button"
        @click="mode = 'inpaint'"
        class="group relative cursor-pointer rounded-lg border-2 border-ink bg-background p-3 text-left shadow-[2px_2px_0_#16171a] transition-all duration-150 hover:-translate-y-0.5"
        :class="
          mode === 'inpaint'
            ? 'bg-paper-2'
            : 'opacity-60 shadow-none'
        "
      >
        <div class="flex items-start gap-2.5">
          <div
            class="mt-0.5 flex h-5 w-5 shrink-0 items-center justify-center rounded-md border-2 border-ink transition-all duration-150"
            :class="
              mode === 'inpaint'
                ? 'bg-hot text-white'
                : 'bg-transparent text-transparent'
            "
          >
            <svg
              x-show="mode === 'inpaint'"
              x-cloak
              viewBox="0 0 20 20"
              fill="none"
              class="h-3.5 w-3.5"
            >
              <path
                d="M4 10.5 8 14l8-8"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
              />
            </svg>
          </div>
          <div>
            <p class="font-display text-xs font-bold text-ink">Inpaint</p>
            <p class="mt-1 text-[10px] leading-relaxed text-ink/50">
              Smart inpainting
            </p>
          </div>
        </div>
      </button>
    </div>
  </div>
  <div class="my-5 border-t-2 border-ink/15"></div>
  <div>
    <div class="flex items-center justify-between gap-4">
      <div>
        <h3
          class="font-display text-sm font-bold uppercase tracking-wide text-ink"
        >
          Padding
        </h3>
        <p class="mt-1 text-[10px] leading-relaxed text-ink/50">
          Add extra area around detections.
        </p>
      </div>
      <span
        class="rounded-full border-2 border-ink bg-paper-2 px-2.5 py-1 font-mono text-[10px] font-bold text-ink"
        x-text="`${padding}%`"
      ></span>
    </div>
    <div class="mt-4">
      <input
        type="range"
        min="0"
        max="100"
        x-model.number="padding"
        class="h-2 w-full cursor-pointer appearance-none rounded-full border-2 border-ink bg-paper-2 accent-hot"
        :style="`background: linear-gradient(to right, var(--color-hot) ${padding}%, var(--color-paper-2) ${padding}%)`"
      />
    </div>
  </div>
  <div
    class="mt-6 rounded-xl border-2 border-ink bg-background p-4 shadow-[2px_2px_0_#16171a]"
  >
    <div class="flex items-start justify-between gap-3">
      <div>
        <p class="font-display text-sm font-bold text-ink">
          Selected for Anonymization
        </p>
        <p
          class="mt-1 text-[10px] text-ink/50"
          x-text="`${selectedDetections.length} ${
            selectedDetections.length === 1 ? 'item' : 'items'
          } selected`"
        ></p>
      </div>
      <button
        type="button"
        @click="selectedDetections = []"
        :disabled="selectedDetections.length === 0"
        class="cursor-pointer whitespace-nowrap rounded-full border-2 border-ink bg-paper px-2.5 py-1.5 font-mono text-[10px] font-bold uppercase tracking-wide text-ink shadow-[1px_1px_0_#16171a] transition-all duration-150 hover:translate-x-0.5 hover:translate-y-0.5 hover:shadow-none disabled:cursor-not-allowed disabled:opacity-35"
      >
        Clear all
      </button>
    </div>
    <div class="mt-3 flex flex-wrap gap-1.5">
      <template
        x-for="detection in selectedDetections"
        :key="detection.uniqueId || detection.id"
      >
        <span
          class="inline-flex items-center gap-1 rounded-full border-2 border-ink bg-paper-2 px-2.5 py-1 font-mono text-[10px] font-bold text-ink"
        >
          <span x-text="detectionName(detection)"></span>
          <button
            type="button"
            class="cursor-pointer text-ink/50 transition hover:text-hot"
            :aria-label="`Remove ${detectionName(detection)}`"
            @click.stop="toggleDetection(detection)"
          >
            <span class="[&>svg]:h-3 [&>svg]:w-3">
              {% include "components/icons/close.svg" %}
            </span>
          </button>
        </span>
      </template>
      <template x-if="selectedDetections.length === 0">
        <span class="font-mono text-[10px] uppercase tracking-wide text-ink/35">
          No detections selected.
        </span>
      </template>
    </div>
  </div>
  <button
    type="button"
    @click="anonymizeSelected()"
    :disabled="isProcessing || selectedDetections.length === 0"
    :class="
      isProcessing || selectedDetections.length === 0
        ? 'cursor-not-allowed bg-ink/10 text-ink/35 shadow-none'
        : 'cursor-pointer bg-hot text-white shadow-[3px_3px_0_#16171a] hover:translate-x-0.5 hover:translate-y-0.5 hover:shadow-[1px_1px_0_#16171a] active:translate-x-1 active:translate-y-1'
    "
    class="mt-5 flex w-full items-center justify-center gap-2 rounded-lg border-2 border-ink px-4 py-3.5 font-mono text-xs font-bold uppercase tracking-wide transition-all duration-150"
  >
    <template x-if="!isProcessing">
      <span class="flex items-center gap-2">
        <span>Process File</span>
        <span
          class="transition-transform duration-150 group-hover:translate-x-1"
        >
          {% include "components/icons/arrow-right.svg" %}
        </span>
      </span>
    </template>
    <template x-if="isProcessing">
      <span class="flex items-center gap-2">
        <span
          class="h-4 w-4 animate-spin rounded-full border-2 border-ink/20 border-t-ink"
        ></span>
        Processing...
      </span>
    </template>
  </button>
</div>
