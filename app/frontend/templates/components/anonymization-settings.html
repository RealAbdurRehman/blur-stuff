<div
  class="rounded-2xl border border-white/10 bg-white/2 p-5 shadow-[0_20px_60px_rgba(0,0,0,0.18)]"
>
  <div class="mb-5">
    <h2 class="text-sm font-semibold text-white">Anonymization Mode</h2>
    <p class="mt-1 text-xs leading-relaxed text-zinc-500">
      Choose how the selected content should be obscured.
    </p>
  </div>
  <div class="grid grid-cols-2 gap-2">
    <button
      type="button"
      class="group relative rounded-xl border border-indigo-500/70 bg-indigo-500/5 p-3 text-left transition cursor-pointer"
    >
      <div class="flex items-start gap-2.5">
        <div
          class="mt-0.5 flex h-4 w-4 shrink-0 items-center justify-center rounded-full border border-indigo-400 bg-indigo-500"
        >
          <div class="h-1.5 w-1.5 rounded-full bg-white"></div>
        </div>
        <div class="min-w-0">
          <p class="text-xs font-semibold text-white">Blur</p>
          <p class="mt-1 text-[10px] text-zinc-500">Smooth blur</p>
        </div>
      </div>
    </button>
    <button
      type="button"
      class="group rounded-xl border border-white/5 bg-white/2 p-3 text-left transition hover:border-white/10 hover:bg-white/4 cursor-pointer"
    >
      <div class="flex items-start gap-2.5">
        <div
          class="mt-0.5 h-4 w-4 shrink-0 rounded-full border border-white/20 bg-black/20 transition group-hover:border-white/30"
        ></div>
        <div class="min-w-0">
          <p class="text-xs font-semibold text-white">Pixelate</p>
          <p class="mt-1 text-[10px] text-zinc-500">Mosaic effect</p>
        </div>
      </div>
    </button>
    <button
      type="button"
      class="group rounded-xl border border-white/5 bg-white/2 p-3 text-left transition hover:border-white/10 hover:bg-white/4 cursor-pointer"
    >
      <div class="flex items-start gap-2.5">
        <div
          class="mt-0.5 h-4 w-4 shrink-0 rounded-full border border-white/20 bg-black/20 transition group-hover:border-white/30"
        ></div>
        <div class="min-w-0">
          <p class="text-xs font-semibold text-white">Solid</p>
          <p class="mt-1 text-[10px] text-zinc-500">Solid color block</p>
        </div>
      </div>
    </button>
    <button
      type="button"
      class="group rounded-xl border border-white/5 bg-white/2 p-3 text-left transition hover:border-white/10 hover:bg-white/4 cursor-pointer"
    >
      <div class="flex items-start gap-2.5">
        <div
          class="mt-0.5 h-4 w-4 shrink-0 rounded-full border border-white/20 bg-black/20 transition group-hover:border-white/30"
        ></div>
        <div class="min-w-0">
          <p class="text-xs font-semibold text-white">Noise</p>
          <p class="mt-1 text-[10px] text-zinc-500">Add noise</p>
        </div>
      </div>
    </button>
    <button
      type="button"
      class="group rounded-xl border border-white/5 bg-white/2 p-3 text-left transition hover:border-white/10 hover:bg-white/4 cursor-pointer"
    >
      <div class="flex items-start gap-2.5">
        <div
          class="mt-0.5 h-4 w-4 shrink-0 rounded-full border border-white/20 bg-black/20 transition group-hover:border-white/30"
        ></div>
        <div class="min-w-0">
          <p class="text-xs font-semibold text-white">Emoji</p>
          <p class="mt-1 text-[10px] text-zinc-500">Replace with emoji</p>
        </div>
      </div>
    </button>
    <button
      type="button"
      class="group rounded-xl border border-white/5 bg-white/2 p-3 text-left transition hover:border-white/10 hover:bg-white/4 cursor-pointer"
    >
      <div class="flex items-start gap-2.5">
        <div
          class="mt-0.5 h-4 w-4 shrink-0 rounded-full border border-white/20 bg-black/20 transition group-hover:border-white/30"
        ></div>
        <div class="min-w-0">
          <p class="text-xs font-semibold text-white">Inpaint</p>
          <p class="mt-1 text-[10px] text-zinc-500">Smart inpainting</p>
        </div>
      </div>
    </button>
  </div>
  <div class="my-5 h-px bg-white/5"></div>
  <div>
    <div class="flex items-center justify-between">
      <div>
        <h3 class="text-xs font-semibold text-white">Padding</h3>
        <p class="mt-1 text-[10px] text-zinc-500">
          Add extra area around detections.
        </p>
      </div>
      <span class="text-xs font-medium text-zinc-400"> 20% </span>
    </div>
    <div class="mt-4">
      <input
        type="range"
        min="0"
        max="100"
        value="20"
        class="h-1.5 w-full cursor-pointer appearance-none rounded-full bg-white/10 accent-indigo-500"
      />
    </div>
  </div>
  <div class="mt-6 rounded-xl border border-white/5 bg-black/10 p-3.5">
    <div class="flex items-center justify-between">
      <div>
        <p class="text-xs font-semibold text-white">
          Selected for Anonymization
        </p>
        <p class="mt-1 text-[10px] text-zinc-500">2 items selected</p>
      </div>
      <button
        type="button"
        class="rounded-lg border border-white/10 px-2.5 py-1.5 text-[10px] font-medium text-zinc-400 transition hover:border-white/15 hover:bg-white/5 hover:text-white cursor-pointer"
      >
        Clear all
      </button>
    </div>
    <div class="mt-3 flex flex-wrap gap-1.5">
      <span
        class="inline-flex items-center gap-1 rounded-md border border-indigo-500/20 bg-indigo-500/10 px-2 py-1 text-[12px] font-medium text-indigo-300"
      >
        Face 1
        <button
          type="button"
          class="text-indigo-400 transition hover:text-white cursor-pointer"
          aria-label="Remove Face 1"
        >
          <span class="&>svg]:h-3.5 [&>svg]:w-3.5">
            {% include "components/icons/close.svg" %}
          </span>
        </button>
      </span>
      <span
        class="inline-flex items-center gap-1 rounded-md border border-indigo-500/20 bg-indigo-500/10 px-2 py-1 text-[12px] font-medium text-indigo-300"
      >
        Face 2
        <button
          type="button"
          class="text-indigo-400 transition hover:text-white cursor-pointer"
          aria-label="Remove Face 2"
        >
          <span class="&>svg]:h-3.5 [&>svg]:w-3.5">
            {% include "components/icons/close.svg" %}
          </span>
        </button>
      </span>
    </div>
  </div>
  <button
    type="button"
    class="mt-4 flex w-full items-center justify-center gap-2 rounded-xl bg-white px-4 py-3 text-sm font-semibold text-black transition hover:bg-zinc-200 cursor-pointer"
  >
    Process File
    <svg viewBox="0 0 20 20" fill="none" class="h-4 w-4">
      <path
        d="M4 10H16M11 5L16 10L11 15"
        stroke="currentColor"
        stroke-width="1.7"
        stroke-linecap="round"
        stroke-linejoin="round"
      />
    </svg>
  </button>
  <div
    class="mt-3 flex items-center justify-center gap-1.5 text-[10px] text-zinc-600"
  >
    <svg viewBox="0 0 20 20" fill="none" class="h-3 w-3">
      <rect
        x="5"
        y="9"
        width="10"
        height="8"
        rx="2"
        stroke="currentColor"
        stroke-width="1.4"
      />
      <path
        d="M7 9V6.5C7 4.843 8.343 3.5 10 3.5C11.657 3.5 13 4.843 13 6.5V9"
        stroke="currentColor"
        stroke-width="1.4"
      />
    </svg>
    Processing happens locally and securely
  </div>
</div>
